name: Collect Trends

on:
  workflow_dispatch:  # 外部cron（cron-job.org）からAPI経由で発火（JST 11:55）
    inputs:
      notify_at:
        description: "Slack送信時刻(JST HH:MM)。この10分前以内に準備できたら時刻ちょうどまで待つ"
        required: false
        default: "12:00"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check if today is a Japanese holiday
        id: holiday
        run: |
          TODAY=$(TZ=Asia/Tokyo date +'%Y-%m-%d')
          HOLIDAYS=$(curl -sf https://holidays-jp.github.io/api/v1/date.json || echo "")
          if [ -z "$HOLIDAYS" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠ 祝日API取得失敗 → 安全のためスキップ: $TODAY"
          elif echo "$HOLIDAYS" | TODAY="$TODAY" python3 -c "import sys,json,os; d=json.load(sys.stdin); h=d.get(os.environ['TODAY'],''); print(h); exit(0 if not h else 1)"; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "祝日のためスキップ: $TODAY"
          fi

      - uses: actions/checkout@v4
        if: steps.holiday.outputs.skip != 'true'

      - name: Set up Python
        if: steps.holiday.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.holiday.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Read site URL from _config.yml
        if: steps.holiday.outputs.skip != 'true'
        id: site
        run: |
          url=$(grep '^url:' _config.yml | sed 's/url: *"\(.*\)"/\1/')
          baseurl=$(grep '^baseurl:' _config.yml | sed 's/baseurl: *"\(.*\)"/\1/')
          echo "site_url=${url}${baseurl}" >> $GITHUB_OUTPUT

      - name: Collect HF Papers
        if: steps.holiday.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_URL: https://github.com/${{ github.repository }}
          SITE_URL: ${{ steps.site.outputs.site_url }}
        run: python scripts/collect_hf_papers.py

      - name: Collect Daily News
        if: steps.holiday.outputs.skip != 'true'
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
          DEEPL_ENABLED: ${{ vars.DEEPL_ENABLED }}
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
          SITE_URL: ${{ steps.site.outputs.site_url }}
        run: python scripts/collect_daily_news.py

      - name: Commit and push
        if: steps.holiday.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git diff --cached --quiet && echo "変更なし" || git commit -m "trend: $(date +'%Y-%m-%d %H:%M' -d '+9 hours')"
          git push

      - name: Notify Slack
        if: success() && steps.holiday.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # この時刻(JST)の10分前以内に準備できたら、時刻ちょうどまで待ってから送る
          NOTIFY_AT_JST: ${{ inputs.notify_at || '12:00' }}
        run: |
          python -u - <<'EOF'
          import json, urllib.request, os, time
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          token = os.environ.get("SLACK_BOT_TOKEN", "")
          if not token:
              print("SLACK_BOT_TOKEN未設定。スキップ。")
              exit(0)

          def post(text):
              channel = os.environ.get("SLACK_CHANNEL_ID", "")
              if not channel:
                  print("SLACK_CHANNEL_ID未設定。スキップ。")
                  return
              data = json.dumps({"channel": channel, "text": text}).encode("utf-8")
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"}
              )
              print(json.loads(urllib.request.urlopen(req).read()).get("ok"))

          def wait_for_url(url, label):
              for i in range(30):
                  try:
                      if urllib.request.urlopen(url).getcode() == 200:
                          print(f'{label} ビルド完了確認（{(i+1)*10}秒）')
                          return True
                  except:
                      pass
                  print(f'{label} ビルド待機中... ({(i+1)*10}秒経過)')
                  time.sleep(10)
              print(f'{label} タイムアウト。そのまま送信します。')
              return False

          JST = timezone(timedelta(hours=9))

          def wait_until_notify_time():
              hh, mm = map(int, os.environ.get("NOTIFY_AT_JST", "12:00").split(":"))
              now = datetime.now(JST)
              target = now.replace(hour=hh, minute=mm, second=0, microsecond=0)
              wait = (target - now).total_seconds()
              # 手動実行など予定外の時刻に動いたときは待たない
              if 0 < wait <= 600:
                  print(f"{target:%H:%M:%S} まで {wait:.0f} 秒待機")
                  time.sleep(wait)
              else:
                  print(f"送信時刻の待機なし（現在 {now:%H:%M:%S}）")

          date_str = datetime.now(JST).strftime("%Y-%m-%d")

          daily_url = Path("/tmp/daily_url.txt").read_text().strip() if Path("/tmp/daily_url.txt").exists() else ""
          hf_url    = Path("/tmp/hf_url.txt").read_text().strip()    if Path("/tmp/hf_url.txt").exists()    else ""

          if daily_url:
              wait_for_url(daily_url, "ニュース")
          if hf_url:
              wait_for_url(hf_url, "トレンド論文")
          wait_until_notify_time()
          if daily_url:
              post(f"<{daily_url}|{date_str} : ニュース>")
          if hf_url:
              post(f"<{hf_url}|{date_str} : トレンド論文>")
          print(f"送信完了 {datetime.now(JST):%H:%M:%S}")
          EOF
